name: Refresh signed launcher metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: soulblock-publisher-freshness
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'askk1337/soulblock-launcher-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify and publish signed freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node publisher/actions-sync.mjs
